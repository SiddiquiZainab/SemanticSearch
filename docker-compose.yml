services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: semantic_search_fastapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SEMANTIC_SEARCH_DATA_DIR: /data
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}"
    volumes:
      - "${SEMANTIC_SEARCH_DATA_DIR:-./data}:/data:ro"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: semantic_search_streamlit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://fastapi:8000
      SEMANTIC_SEARCH_DATA_DIR: /data
    volumes:
      - "${SEMANTIC_SEARCH_DATA_DIR:-./data}:/data:ro"
    depends_on:
      - fastapi
